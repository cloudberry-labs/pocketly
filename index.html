<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pocketly</title>
  <style>
    @font-face{font-family:"Darumadrop One";src:url("https://raw.githubusercontent.com/google/fonts/main/ofl/darumadropone/DarumadropOne-Regular.ttf") format("truetype");font-display:swap}
    :root{color-scheme:light;--ink:#413453;--pink:#ed72a6;--pink-deep:#be4f84;--cream:#fff9f1}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Darumadrop One",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink)}
    body{display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 13% 10%,#fff 0 7%,transparent 7.2%),radial-gradient(circle at 92% 12%,#cfefff 0 17%,transparent 17.2%),linear-gradient(145deg,#fff0f7,#edf8ff)}
    button{font:inherit}
    .lab{width:min(100%,460px);padding:20px 16px 18px;border-radius:34px;background:linear-gradient(180deg,rgba(246,252,255,.9),rgba(255,242,248,.9));box-shadow:0 14px 38px rgba(88,76,105,.12)}
    .lab-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 5px 11px}
    .lab-head small{display:block;color:#887c91;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .lab-head h1{margin:2px 0 0;font-size:27px;line-height:1}
    .preview-button{min-height:42px;padding:7px 13px;border:3px solid #fff;border-radius:16px;background:linear-gradient(#f38ab5,#e66fa5);box-shadow:0 5px 0 var(--pink-deep),0 9px 16px rgba(94,65,88,.17);color:#fff;font-size:11px;font-weight:900;cursor:pointer;touch-action:manipulation}
    .preview-button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
    .preview-button:disabled{cursor:wait;opacity:.65}
.currency-select{min-height:42px;padding:7px 9px;border:3px solid #fff;border-radius:16px;background:#fff8fc;box-shadow:0 5px 0 #d7a4bc;color:#6d4961;font:inherit;font-size:11px;outline:none;cursor:pointer}
.head-actions{display:flex;gap:7px;align-items:center}
.progress-strip{display:flex;justify-content:space-between;gap:8px;margin:0 5px 10px}
.progress-pill{flex:1;padding:8px 10px;border:3px solid #fff;border-radius:16px;background:rgba(255,255,255,.78);box-shadow:0 5px 12px rgba(83,60,81,.1);text-align:center}
.progress-pill small{display:block;color:#9a8595;font:700 8px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.progress-pill strong{display:block;margin-top:2px;color:#b64f80;font-size:17px;line-height:1}
.progress-pill.challenge-pill{cursor:pointer;touch-action:manipulation}
.progress-pill.challenge-pill:active{transform:translateY(2px)}
.challenge-list{display:grid;gap:8px;margin-top:10px;text-align:left}
.challenge-item{padding:10px 11px;border:2px solid #f1dce7;border-radius:15px;background:#fffafd}
.challenge-item strong{display:block;color:#684c60;font:800 12px system-ui,sans-serif}
.challenge-item span{display:block;margin-top:3px;color:#8c7887;font:11px/1.35 system-ui,sans-serif}
.challenge-done{width:100%;margin-top:8px;padding:7px;border:0;border-radius:999px;background:#ef83af;color:#fff;font:800 10px system-ui,sans-serif;cursor:pointer}

    .storybook-board{position:relative;width:100%;aspect-ratio:2/3;container-type:inline-size;overflow:hidden;border:5px solid #fff;border-radius:38px;background:url("pocketville-board-map.jpg") center/cover no-repeat;box-shadow:0 24px 50px rgba(87,67,101,.23),inset 0 0 0 3px rgba(230,144,181,.5);isolation:isolate}
    .storybook-board:before{content:"";position:absolute;inset:0;z-index:0;background:rgba(255,248,244,.78);backdrop-filter:blur(5px) saturate(.45);-webkit-backdrop-filter:blur(5px) saturate(.45);pointer-events:none}
    .storybook-board:after{content:"";position:absolute;inset:1.3%;z-index:1;border:12px solid rgba(255,190,216,.56);border-radius:32px;box-shadow:inset 0 0 0 3px rgba(145,77,111,.18),0 0 0 4px rgba(255,255,255,.7);pointer-events:none}
    .foliage{position:absolute;z-index:2;color:#6eaa69;font-size:19px;line-height:1;filter:drop-shadow(0 2px 1px rgba(72,81,58,.15));pointer-events:none}
    .foliage.f1{left:2%;top:14%;transform:rotate(-18deg)}.foliage.f2{right:2%;top:15%;transform:rotate(20deg)}
    .foliage.f3{left:3%;bottom:14%;transform:rotate(13deg)}.foliage.f4{right:3%;bottom:14%;transform:rotate(-16deg)}
    .foliage.f5{left:28%;top:14%;font-size:15px}.foliage.f6{right:29%;bottom:13%;font-size:15px}

    .center-world{position:absolute;inset:14.3% 16.2%;z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid rgba(255,255,255,.9);border-radius:30px;background:url("pocketville-board-map.jpg") center/cover no-repeat;box-shadow:inset 0 0 24px rgba(71,54,82,.12),0 7px 18px rgba(77,59,87,.12);pointer-events:none}
    .center-world:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,239,246,.06) 56%,rgba(255,240,246,.13))}
    .welcome-sign{position:relative;width:78%;margin-top:-20%;padding:10px 12px 11px;border:3px solid rgba(255,255,255,.92);border-radius:22px 27px 19px 25px;background:rgba(255,245,232,.86);box-shadow:0 7px 0 rgba(145,86,105,.2),0 12px 18px rgba(67,53,74,.14);text-align:center;transform:rotate(-1.2deg);backdrop-filter:blur(2px)}
    .welcome-sign small{display:block;font-size:11px}.welcome-sign strong{display:block;color:#9c486c;font-size:25px;line-height:1}.welcome-sign span{display:block;margin-top:4px;font-size:9px}

    .tile{--line:rgba(135,80,109,.34);--c1:#f9dce8;--c2:#f5cddd;position:absolute;z-index:6;left:var(--x);top:var(--y);width:var(--w);height:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 3px;border:3px solid rgba(255,255,255,.96);border-radius:var(--wiggle,38% 62% 46% 54% / 34% 43% 57% 66%);background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 0 0 1.5px var(--line);color:#392d5a;text-align:center;transform:translate3d(0,0,0) rotate(var(--rot));transform-origin:center;cursor:pointer;touch-action:manipulation;will-change:transform,filter}
    .tile:before{content:"";position:absolute;z-index:0;left:9%;right:9%;top:5px;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));pointer-events:none}
    .tile:after{content:"";position:absolute;z-index:0;inset:3px;border-radius:inherit;background:radial-gradient(circle at 16% 28%,rgba(91,57,82,.055) 0 .55px,transparent .9px),radial-gradient(circle at 74% 36%,rgba(255,255,255,.55) 0 .65px,transparent 1px),radial-gradient(circle at 41% 81%,rgba(91,57,82,.045) 0 .55px,transparent 1px);background-size:11px 13px,15px 17px,13px 15px;opacity:.42;pointer-events:none}
    .tile>*{z-index:2}
    .tile:hover{filter:brightness(1.035)}
    .tile-number{position:absolute;left:8px;top:5px;color:#342755;font-size:clamp(8px,1.8cqw,11px);font-weight:400;text-shadow:0 1px #fff}
    .tile-icon{font-size:clamp(19px,5.3cqw,31px);line-height:1;filter:drop-shadow(0 2px 0 rgba(255,255,255,.75)) drop-shadow(0 3px 2px rgba(78,56,77,.18))}
    .tile-name{max-width:100%;margin-top:4px;color:#302653;font-size:clamp(8px,2.15cqw,13px);font-weight:400;line-height:.92;letter-spacing:.01em;overflow-wrap:normal;text-shadow:0 1px rgba(255,255,255,.85)}
    .tile.pink,.tile.mint,.tile.lavender{--c1:#fbe2ec;--c2:#f7d2e1;--line:rgba(224,145,178,.5)}
    .tile.blue,.tile.yellow,.tile.peach{--c1:#e5f5fc;--c2:#d4edf9;--line:rgba(126,190,222,.5)}
    .tile.side-left,.tile.side-right{padding-inline:2px}
    .tile:nth-of-type(4n+1){--wiggle:27% 73% 34% 66% / 39% 28% 72% 61%}
    .tile:nth-of-type(4n+2){--wiggle:67% 33% 72% 28% / 30% 65% 35% 70%}
    .tile:nth-of-type(4n+3){--wiggle:38% 62% 25% 75% / 69% 32% 68% 31%}
    .tile:nth-of-type(4n){--wiggle:74% 26% 59% 41% / 43% 73% 27% 57%}
    .tile.side-left .tile-name,.tile.side-right .tile-name{font-size:clamp(7px,1.75cqw,10px)}
    .tile.feature{z-index:8;border-width:4px;box-shadow:0 0 0 2px var(--line)}
    .tile.feature .tile-icon{display:grid;width:68%;min-height:44%;place-items:center;border:0;border-radius:45% 55% 48% 52%/52% 43% 57% 48%;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.76),rgba(255,255,255,.18) 67%,transparent 69%);font-size:clamp(27px,7.4cqw,43px)}
    .tile.feature .tile-name{font-size:clamp(11px,2.7cqw,16px);line-height:.87}
    .tile.key-press{z-index:15;animation:keyPress .34s cubic-bezier(.2,.78,.25,1)}
    .tile.key-final{z-index:16;animation:keyFinal .62s cubic-bezier(.18,.8,.22,1)}
    @keyframes keyPress{
      0%,100%{transform:translate3d(0,0,0) rotate(var(--rot)) scale(1);box-shadow:0 var(--depth) 0 var(--edge),0 calc(var(--depth) + 4px) 12px rgba(65,51,76,.14),inset 0 3px 7px rgba(255,255,255,.68)}
      42%{transform:translate3d(0,5px,0) rotate(var(--rot)) scale(.96,.91);box-shadow:0 1px 0 var(--edge),0 3px 5px rgba(65,51,76,.1),inset 0 2px 8px rgba(255,255,255,.82);filter:brightness(1.08)}
      72%{transform:translate3d(0,-2px,0) rotate(var(--rot)) scale(1.025)}
    }
    @keyframes keyFinal{
      0%,100%{transform:translate3d(0,0,0) rotate(var(--rot)) scale(1)}
      24%{transform:translate3d(0,6px,0) rotate(var(--rot)) scale(.93,.87);box-shadow:0 1px 0 var(--edge),0 3px 4px rgba(65,51,76,.08);filter:brightness(1.1)}
      52%{transform:translate3d(0,-5px,0) rotate(var(--rot)) scale(1.075);box-shadow:0 10px 0 var(--edge),0 15px 18px rgba(65,51,76,.15)}
      76%{transform:translate3d(0,1px,0) rotate(var(--rot)) scale(.985)}
    }
    .spark{position:absolute;z-index:20;width:7px;height:7px;border-radius:50%;background:#fff8a8;box-shadow:15px -6px 0 #ffd0e2,-14px -7px 0 #c8efff,9px 12px 0 #e7d8ff;pointer-events:none;animation:spark .58s ease-out forwards}
    @keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}32%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px) scale(1.5) rotate(90deg)}}
    .character-layer{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:visible}
.cici-token{position:absolute;left:0;top:0;width:clamp(48px,14cqw,78px);height:clamp(48px,14cqw,78px);transform-origin:50% 92%;will-change:transform}
.cici-sprite{display:block;width:100%;height:100%;background:url("cici-walk-atlas-v2.webp") 0 0/400% 200% no-repeat;filter:drop-shadow(0 5px 3px rgba(48,43,57,.25));transform-origin:50% 92%}
.cici-token[data-state="idle"] .cici-sprite{animation:ciciIdle 3.2s ease-in-out infinite}
.cici-token[data-state="landing"] .cici-sprite{animation:ciciLand .43s cubic-bezier(.2,.8,.25,1)}
@keyframes ciciIdle{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-2px) rotate(.7deg) scale(1.01,.995)}}
@keyframes ciciLand{0%{transform:translateY(0)}36%{transform:translateY(-20px) rotate(-5deg) scale(.96,1.08)}68%{transform:translateY(5px) scale(1.12,.82)}84%{transform:translateY(-3px) scale(.98,1.04)}100%{transform:translateY(0)}}
.dev-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 4px 0}
.dev-controls button{padding:8px 11px;border:2px solid #fff;border-radius:13px;background:#fff;box-shadow:0 3px 0 #d7c7dc;color:#65576e;font-size:10px;cursor:pointer}
.dev-controls button:disabled{opacity:.45;cursor:wait}
.motion-status{margin:9px 7px 0;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.82);color:#766a7d;font-size:10px;text-align:center}
.motion-status strong{color:#cf5d91}
.dice-zone{position:absolute;left:50%;top:68%;z-index:25;width:150px;height:145px;transform:translate(-50%,-50%);perspective:700px;pointer-events:none}
.dice-button{position:absolute;inset:0;margin:auto;width:120px;height:130px;border:0;background:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.dice-button:disabled{cursor:wait}
.dice-shadow{position:absolute;left:50%;bottom:16px;width:68px;height:17px;border-radius:50%;background:rgba(85,58,69,.23);filter:blur(5px);transform:translateX(-50%)}
.die-scene{position:absolute;left:50%;top:43%;width:64px;height:64px;margin:-32px;transform-style:preserve-3d;will-change:transform}
.die{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;border:2px solid rgba(255,255,255,.94);border-radius:15px;background:linear-gradient(145deg,#fffef9,#faefdf 62%,#ead4bd);box-shadow:inset 7px 7px 13px rgba(255,255,255,.85),inset -7px -8px 13px rgba(139,99,75,.19),0 0 0 1px rgba(115,84,68,.08);backface-visibility:hidden}
.f1{transform:rotateY(0) translateZ(32px)}.f2{transform:rotateY(90deg) translateZ(32px)}.f3{transform:rotateX(90deg) translateZ(32px)}.f4{transform:rotateX(-90deg) translateZ(32px)}.f5{transform:rotateY(-90deg) translateZ(32px)}.f6{transform:rotateY(180deg) translateZ(32px)}
.pip{align-self:center;justify-self:center;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#716a75,#29252d 62%)}
.p1{grid-area:1/1}.p2{grid-area:1/2}.p3{grid-area:1/3}.p4{grid-area:2/1}.p5{grid-area:2/2}.p6{grid-area:2/3}.p7{grid-area:3/1}.p8{grid-area:3/2}.p9{grid-area:3/3}
.roll-label{position:absolute;left:50%;bottom:0;min-width:120px;padding:8px 10px;border:2px solid #fff;border-radius:999px;background:linear-gradient(#f28ab6,#e66ea4);box-shadow:0 5px 0 var(--pink-deep),0 9px 14px rgba(95,66,87,.18);color:#fff;font-size:10px;transform:translateX(-50%);white-space:nowrap}

.landing-overlay{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:22px;background:rgba(66,48,75,.24);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s}
.landing-overlay.show{opacity:1;visibility:visible}
.landing-card{width:min(82%,330px);padding:22px 18px 17px;border:4px solid #fff;border-radius:30px;background:linear-gradient(155deg,#fffdf8,#fff0f6);box-shadow:0 12px 0 rgba(174,91,128,.2),0 25px 45px rgba(62,43,72,.28);text-align:center;transform:translateY(18px) scale(.82);opacity:0}
.landing-overlay.show .landing-card{animation:popupIn .46s cubic-bezier(.18,.9,.28,1.25) forwards}
@keyframes popupIn{60%{transform:translateY(-5px) scale(1.035);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.landing-emoji{display:grid;place-items:center;width:68px;height:68px;margin:-5px auto 7px;border:3px solid #fff;border-radius:50%;background:#fff8fc;box-shadow:0 5px 14px rgba(100,67,91,.14);font-size:38px}
.landing-type{margin:0;color:#d25c91;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.landing-title{margin:3px 0 6px;color:#443552;font-size:27px;line-height:1}
.landing-message{margin:0 auto 14px;max-width:260px;color:#74677c;font-family:system-ui,-apple-system,sans-serif;font-size:12px;line-height:1.45}
.landing-action{min-width:130px;padding:10px 17px;border:3px solid #fff;border-radius:999px;background:linear-gradient(#f38ab5,#e66fa5);box-shadow:0 5px 0 var(--pink-deep);color:#fff;font-size:12px;cursor:pointer}
.landing-action:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
.landing-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.landing-skip{min-width:105px;padding:10px 15px;border:3px solid #fff;border-radius:999px;background:#f3edf2;box-shadow:0 5px 0 #d7c5d0;color:#806f7c;font-size:12px;cursor:pointer}
.landing-skip:active{transform:translateY(4px);box-shadow:0 1px 0 #d7c5d0}
.note{margin:9px 7px 0;color:#766a7d;font-size:11px;line-height:1.45;text-align:center}
    @media(max-width:390px){body{padding:8px}.lab{padding:12px 8px 10px;border-radius:28px}.lab-head{margin-inline:7px}.lab-head h1{font-size:23px}.preview-button{padding-inline:10px}.storybook-board{border-radius:28px}.tile{border-width:2px}.tile.feature{border-width:3px}.tile-number{left:5px;top:4px}.center-world{border-radius:23px}.welcome-sign strong{font-size:20px}}
    @media(prefers-reduced-motion:reduce){.tile.key-press,.tile.key-final{animation-duration:.08s}.spark{display:none}}
  
    .production-nav{position:relative;bottom:auto;z-index:100;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%;margin:-24px auto 0;padding:7px;border:3px solid rgba(255,255,255,.92);border-radius:22px;background:rgba(255,250,253,.93);box-shadow:0 9px 24px rgba(74,54,82,.18);backdrop-filter:blur(12px)}
    .production-nav button{min-width:0;padding:7px 3px;border:0;border-radius:15px;background:transparent;color:#7a6c7e;font:10px "Darumadrop One",sans-serif;cursor:pointer}.production-nav button span{display:block;font-size:19px}.production-nav button.active{background:#ffe4ef;color:#bd5684}
    .pocket-game-progress{display:grid;gap:3px;width:min(88%,250px);margin:7px auto 0;font-family:"Darumadrop One",sans-serif}.pocket-game-progress b{font-size:12px;color:#d15f8e}.pocket-game-progress span,.pocket-game-progress small{font-size:8px;color:#746b7e}.pocket-game-progress i{display:block;height:6px;overflow:hidden;border-radius:99px;background:#eadfe8}.pocket-game-progress em{display:block;width:0;height:100%;border-radius:inherit;background:#ef8caf;transition:width .3s}</style>
</head>
<body>
  <main class="lab">
    <header class="lab-head"><div><small>Pocketly</small><h1>Pocketville</h1></div><div class="head-actions"><span class="currency-select" id="currencySelect">Active Pocket</span></div></header>
    <div class="progress-strip"><div class="progress-pill"><small>Savings Total</small><strong id="savingsTotal">₱0</strong></div><div class="progress-pill challenge-pill" id="challengePill" role="button" tabindex="0"><small>Active Challenges · Tap to view</small><strong id="challengeCount">0</strong></div></div>
    <section class="storybook-board" id="board" aria-label="Pocketly 36-space board layout preview">
      <i class="foliage f1">🌿🌸</i><i class="foliage f2">🌼🌿</i><i class="foliage f3">🌸🌱</i><i class="foliage f4">🌿🌷</i><i class="foliage f5">🌸</i><i class="foliage f6">🌼</i>
      <div class="center-world"><div class="welcome-sign"><small>Welcome to</small><strong>Pocketville</strong><span id="activePocketName">No active pocket</span><div class="pocket-game-progress"><b id="activePocketSaved">—</b><span id="activePocketRemaining">Create a pocket to play</span><i><em id="activePocketFill"></em></i><small id="activePocketPercent">0% saved</small></div></div></div>
      <div class="dice-zone"><button class="dice-button" id="diceButton" type="button" aria-label="Roll dice"><span class="dice-shadow" id="diceShadow"></span><span class="die-scene" id="dieScene"><span class="die" id="die"><span class="face f1"><i class="pip p5"></i></span><span class="face f2"><i class="pip p1"></i><i class="pip p9"></i></span><span class="face f3"><i class="pip p1"></i><i class="pip p5"></i><i class="pip p9"></i></span><span class="face f4"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p7"></i><i class="pip p9"></i></span><span class="face f5"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p5"></i><i class="pip p7"></i><i class="pip p9"></i></span><span class="face f6"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p4"></i><i class="pip p6"></i><i class="pip p7"></i><i class="pip p9"></i></span></span></span><span class="roll-label" id="rollLabel">ROLL 🎲</span></button></div>
      <div class="landing-overlay" id="landingOverlay" aria-hidden="true"><div class="landing-card"><div class="landing-emoji" id="landingEmoji">🎁</div><p class="landing-type" id="landingType">MYSTERY</p><h2 class="landing-title" id="landingTitle">A little surprise!</h2><p class="landing-message" id="landingMessage"></p><div class="landing-actions"><button class="landing-action" id="landingAction" type="button">OKAY!</button><button class="landing-skip" id="landingSkip" type="button">NOT NOW</button></div></div></div>
      <div class="character-layer" id="characterLayer"><span class="cici-token" id="cici" data-state="idle"><span class="cici-sprite" id="ciciSprite"></span></span></div>
    </section>
    <div class="dev-controls" id="devControls" hidden></div><button id="previewButton" type="button" hidden></button>
  <nav class="production-nav" aria-label="Pocketly navigation"><button id="prodHome"><span>🏠</span>Home</button><button id="prodPockets"><span>👛</span>Pockets</button><button class="active"><span>🎲</span>Play</button><button id="prodProfile"><span>🌸</span>Profile</button></nav>
  <script>
    (()=>{
      "use strict";
